<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>New Enquiry Notification</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e293b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f8fafc;padding:40px 20px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);">
            <!-- Header -->
            <tr>
              <td style="padding:32px;text-align:center;background-color:#ffffff;border-bottom:3px solid #b91c1c;">
                <img src="cid:brandlogo" alt="Kanchi Wire Mesh" style="display:block;margin:0 auto;max-width:200px;height:auto;" />
              </td>
            </tr>
            
            <!-- Body -->
            <tr>
              <td style="padding:40px 32px;line-height:1.6;font-size:15px;">
                <h2 style="margin-top:0;color:#0f172a;font-size:22px;font-weight:600;">New Enquiry Received</h2>
                <p style="color:#334155;">A new public enquiry has been submitted by <strong>{{ContactName}}</strong>.</p>
                
                <div style="margin:25px 0;padding:20px;background-color:#fef2f2;border-left:4px solid #ef4444;border-radius:0 8px 8px 0;">
                  <span style="display:block;color:#b91c1c;font-size:12px;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;">Enquiry Reference</span>
                  <strong style="display:block;margin-top:8px;color:#991b1b;font-size:20px;">{{EnquiryNumber}}</strong>
                </div>

                <h3 style="color:#0f172a;font-size:16px;border-bottom:1px solid #e2e8f0;padding-bottom:10px;margin-top:30px;">Enquiry Details</h3>
                
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-top:15px;">
                  {{TableRows}}
                </table>
              </td>
            </tr>
            
            <!-- Footer -->
            <tr>
              <td style="padding:24px 32px;background-color:#f1f5f9;text-align:center;">
                <p style="margin:0;color:#64748b;font-size:14px;">Reply directly to this email to contact the customer.</p>
                <p style="margin:10px 0 0;color:#94a3b8;font-size:12px;">&copy; {{Year}} Kanchi Wire Mesh System.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
